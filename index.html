<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F7EEED" />
    <title>Wo möchte ich studieren?</title>
    <!-- ?v=… zwingt Browser/iPhone, geänderte Icons neu zu laden -->
    <link rel="icon" href="favicon.svg?v=2" type="image/svg+xml" />
    <link rel="icon" href="icon-192.png?v=2" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=2" />
    <link rel="manifest" href="manifest.webmanifest?v=2" />
    <meta name="apple-mobile-web-app-title" content="Auslandssemester" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400;1,500;1,600&family=Jost:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app">
      <header class="title">
        <h1>Wo möchte ich studieren?</h1>
        <p id="summary" class="title__sub">Master Architektur</p>
      </header>

      <div class="frame">
        <svg id="map" class="map" role="img" aria-label="Weltkarte der Partner-Unis"></svg>

        <p id="status" class="status" hidden></p>

        <div class="controls">
          <button type="button" class="control" id="zoom-in" aria-label="Hineinzoomen">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
          </button>
          <button type="button" class="control" id="zoom-out" aria-label="Herauszoomen">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M5 12h14" /></svg>
          </button>
          <button type="button" class="control" id="zoom-reset" aria-label="Startansicht">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="8" /><path d="M4 12h16M12 4c2.5 2.5 2.5 13.5 0 16M12 4c-2.5 2.5-2.5 13.5 0 16" /></svg>
          </button>
        </div>

        <aside id="card" class="card" hidden aria-live="polite">
          <button type="button" class="card__close" id="card-close" aria-label="Schließen">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
          </button>
          <img id="card-img" class="card__img" alt="" />
          <div class="card__body">
            <h2 id="card-name" class="card__name"></h2>
            <dl id="card-facts" class="card__facts"></dl>
            <div id="card-link"></div>
          </div>
        </aside>
      </div>

      <p class="hint">Ziehen zum Verschieben, Mausrad oder zwei Finger zum Zoomen. Tipp auf eine Pinnadel für Details.</p>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
    <script src="unis.js"></script>
    <script src="app.js"></script>
  </body>
</html>
